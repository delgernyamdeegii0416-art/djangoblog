
<div class="col-md-4 col-lg-4 mb-4 anime-card-column">
    <article class="card anime-card h-100">

        {% if post.cover_image %}
            <a href="{% url 'post_detail' post.slug %}" class="anime-image-link">
                <img
                    src="{{ post.cover_image.url }}"
                    class="card-img-top anime-card-image"
                    alt="{{ post.title }}"
                >
            </a>
        {% else %}
            <div class="anime-no-image">
                <span>AnimeVerse</span>
            </div>
        {% endif %}

        <div class="card-body anime-card-body">
            <h5 class="card-title anime-card-title">
                <a href="{% url 'post_detail' post.slug %}">
                    {{ post.title }}
                </a>
            </h5>

            <p class="anime-card-description">
                {{ post.content|striptags }}
            </p>

            <div class="anime-card-actions">
                <a href="{% url 'post_detail' post.slug %}"
                   class="btn btn-anime btn-sm">
                    続き
                </a>

                {% if post.author == request.user %}
                    <a href="{% url 'post_edit' post.slug %}"
                       class="btn btn-outline-anime btn-sm">
                        編集
                    </a>

                    <a href="{% url 'post_delete' post.slug %}"
                       class="btn btn-outline-danger btn-sm">
                        削除
                    </a>
                {% endif %}
            </div>
        </div>
    </article>
</div>
