{% extends "blog/base.html" %}

{% block title %}パスワードを変更しました{% endblock %}
{% block page_heading %}パスワードのリセット{% endblock %}
{% block page_subtitle %}完了しました{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">

        <div class="auth-logo">✓</div>
        <h1 class="auth-title">変更が完了しました</h1>
        <p class="auth-subtitle">
            パスワードを変更しました。新しいパスワードでログインできます。
        </p>

        <a class="btn btn-anime auth-submit" href="{% url 'login' %}">ログインへ</a>

    </div>
</section>
{% endblock %}
